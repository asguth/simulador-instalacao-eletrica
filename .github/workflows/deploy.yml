name: Publicar site

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar site com a versão da release
        run: |
          VERSAO="${{ github.event.release.tag_name }}"
          if [ -z "$VERSAO" ]; then VERSAO="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"; fi
          mkdir _site
          cp index.html LICENSE robots.txt sitemap.xml _site/
          sed -i "s/__VERSAO__/${VERSAO}/g" _site/index.html
          sed -i "s/__DATA__/$(date -u +%F)/g" _site/sitemap.xml
          touch _site/.nojekyll
          echo "Publicando versão ${VERSAO}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
